[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-cash"
version = "0.1.0"
description = "Payment-weighted opinion dynamics with conserved cash"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "networkx>=3.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bayes-cash = "bayes_cash.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
